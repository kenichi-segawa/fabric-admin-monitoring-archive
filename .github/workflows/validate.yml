name: Validate solution

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate notebooks and JSON
        run: python scripts/validate_solution.py
      - name: Install PBIR validator
        run: npm install -g @microsoft/powerbi-report-authoring-cli@latest
      - name: Validate PBIR
        run: powerbi-report-author validate "solution/Admin Monitoring Governance & Adoption.Report"
